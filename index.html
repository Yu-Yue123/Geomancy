<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f8f83" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="地占起卦" />
    <title>地占起卦</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">European Geomancy</p>
          <h1>地占起卦</h1>
        </div>
        <button class="icon-button" id="themeToggle" type="button" title="切换明暗模式" aria-label="切换明暗模式">
          <span aria-hidden="true">◐</span>
        </button>
      </header>

      <section class="workspace">
        <aside class="control-panel" aria-label="起卦设置">
          <section class="question-guide" aria-label="起卦指引">
            <label class="question-label">问题类型</label>
            <div class="guide-modes" role="group" aria-label="问题类型">
              <button class="guide-mode active" type="button" data-question-mode="yesno">是否</button>
              <button class="guide-mode" type="button" data-question-mode="development">发展</button>
              <button class="guide-mode" type="button" data-question-mode="custom">自定义</button>
            </div>
            <div class="guide-copy" id="guideCopy"></div>
          </section>

          <label class="question-label" for="question">所问之事</label>
          <textarea id="question" rows="4" placeholder="例如：这次合作是否适合推进？"></textarea>

          <div class="mode-row" role="group" aria-label="起卦方式">
            <button class="segmented active" type="button" data-mode="random">随机起卦</button>
            <button class="segmented" type="button" data-mode="manual">手动四母</button>
          </div>

          <div class="manual-grid" id="manualGrid" hidden></div>

          <div class="actions">
            <button class="primary" id="castButton" type="button">起卦</button>
            <button class="secondary" id="copyButton" type="button">复制</button>
            <button class="secondary" id="clearButton" type="button">清空</button>
          </div>

          <div class="settings">
            <label class="switch">
              <input id="includeSentence" type="checkbox" checked />
              <span>显示调停者</span>
            </label>
            <label class="select-label" for="houseMethod">入宫排法</label>
            <select id="houseMethod">
              <option value="basic">顺排法：四母、四女、四侄入十二宫</option>
              <option value="agrippa">Agrippa：母居角宫、女居续宫、果宫相加生成</option>
            </select>
          </div>

          <section class="summary-card" aria-live="polite">
            <span>判官</span>
            <strong id="judgeName">等待起卦</strong>
            <p id="judgeText">起卦后会显示判官、左右见证和入宫图。</p>
          </section>
        </aside>

        <section class="reading-area">
          <nav class="tabs" aria-label="图表视图">
            <button class="tab active" type="button" data-view="shield">盾形图</button>
            <button class="tab" type="button" data-view="house">入宫图</button>
            <button class="tab" type="button" data-view="notes">解读</button>
          </nav>

          <section class="view active" id="shieldView" aria-label="盾形图"></section>
          <section class="view" id="houseView" aria-label="入宫图"></section>
          <section class="view" id="notesView" aria-label="解读"></section>
        </section>
      </section>
    </main>

    <aside class="detail-panel" id="detailPanel" hidden aria-label="含义页面">
      <div class="detail-topbar">
        <button class="detail-icon" id="closeDetailButton" type="button" title="关闭" aria-label="关闭含义页面">×</button>
        <div>
          <strong class="detail-title">含义</strong>
          <span class="detail-subtitle"></span>
        </div>
        <button class="detail-hide" id="hideSystemButton" type="button">隐藏</button>
      </div>

      <div class="detail-body">
        <div class="detail-glyph" aria-hidden="true"></div>

        <section class="system-content" id="systemContent">
          <div class="detail-row">
            <span>宫位含义</span>
            <p id="detailHouse"></p>
          </div>
          <div class="detail-row">
            <span>卦象含义</span>
            <p id="detailTone"></p>
          </div>
          <div class="meaning-grid">
            <article><span>核心元素</span><p id="detailElement"></p></article>
            <article><span>吉凶</span><p id="detailLuck"></p></article>
            <article><span>金钱</span><p id="detailMoney"></p></article>
            <article><span>感情</span><p id="detailLove"></p></article>
            <article><span>事业</span><p id="detailCareer"></p></article>
            <article><span>健康</span><p id="detailHealth"></p></article>
            <article><span>友情</span><p id="detailFriendship"></p></article>
          </div>
        </section>

        <section class="custom-content">
          <label for="customMeaning">自定义含义</label>
          <textarea id="customMeaning" rows="7" placeholder="在这里写你自己的断语、经验或备注。"></textarea>
        </section>
      </div>
    </aside>

    <script src="./app.js"></script>
  </body>
</html>
